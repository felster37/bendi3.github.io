
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bendy Ink Clicker</title>
    <style>
        /* СТИЛИ: Твои оригинальные стили */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #050505;
            color: #e0e0e0;
            font-family: sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #counter-container {
            text-align: center;
            margin-bottom: 20px;
        }

        #score {
            font-size: 4rem;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            margin: 0;
        }

        .label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        #clicker-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle, #333, #000);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 204, 0, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            position: relative;
            background-image: url('bendy.png'); 
            background-size: cover;             
            background-position: center;        
            background-repeat: no-repeat;       
        }

        #clicker-btn:active {
            transform: scale(0.9);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        #redirect-btn {
            margin-top: 50px;
            padding: 18px 40px;
            background-color: #ffcc00;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 50px;
            opacity: 0;
            transform: translateY(20px); 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; 
            z-index: 100; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }

        #redirect-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .particle {
            position: absolute;
            color: #ffcc00;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 50;
            animation: flyUp 0.6s ease-out forwards;
        }

        @keyframes flyUp {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; }
        }

        /* Твоя кнопка "Чекнуть" */
        .pretty-button display: inline-block; 
padding: 15px 30px;

        transform: scale(1.1);
        background-color: #fff;
    }
</style>
